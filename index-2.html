.glhost::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(20,0,40,.13) 0 1px,transparent 1px 3px);pointer-events:none;z-index:3}

.nbn{display:block;font-size:11px;color:#fff;text-shadow:1px 0 var(--ink),-1px 0 var(--ink),0 1px var(--ink),0 -1px var(--ink),1px 1px var(--ink),-1px -1px var(--ink);white-space:nowrap;margin-bottom:2px}

.ftx{position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none;color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink);animation:ftx 1.25s steps(12) forwards;white-space:nowrap}

.nogl{padding:40px;text-align:center}
.fb{display:flex;justify-content:space-around;align-items:flex-end;height:100%;padding-top:80px}
.spimg{display:inline-block;user-select:none;pointer-events:none;image-rendering:pixelated}
.bob{animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
/* title */
#title{align-items:center;pointer-events:none}
.tcontent{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:56px 0 44px;width:100%}
.tlogo{text-align:center}
.t1{font-size:84px;line-height:1;letter-spacing:2px;color:var(--yel);text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),4px 4px var(--ink),-4px -4px var(--ink),4px -4px var(--ink),-4px 4px var(--ink),0 10px 0 var(--pinkd),4px 10px 0 var(--pinkd),-4px 10px 0 var(--pinkd);animation:bob 1.6s steps(2) infinite}
.t2{font-size:18px;letter-spacing:8px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:16px}
.t3{margin-top:14px;display:inline-block;background:var(--paper);padding:5px 12px;font-size:13px;box-shadow:var(--bd)}
.tnote{font-size:12px;color:#fff;text-shadow:1px 1px 0 var(--ink);margin:14px 0 0;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#title .gbtn{pointer-events:auto}
/* buttons */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;margin:3px;font-size:15px;color:#fff;background:var(--pink);box-shadow:var(--bd),inset 0 -4px 0 0 var(--pinkd),inset 3px 3px 0 0 var(--pinkl),3px 6px 0 0 var(--ink);text-shadow:1px 1px 0 var(--ink);position:relative;top:0}
.gbtn:active:not(:disabled){top:3px;box-shadow:var(--bd),inset 0 -2px 0 0 var(--pinkd),inset 3px 3px 0 0 var(--pinkl)}
.gbtn:disabled{filter:grayscale(1) brightness(.9);opacity:.6;cursor:not-allowed}
.gbtn.sm{padding:6px 10px;font-size:13px}
.gbtn.mint{background:var(--mint);color:var(--ink);text-shadow:none;box-shadow:var(--bd),inset 0 -4px 0 0 var(--mintd),inset 3px 3px 0 0 #d6ffe8,3px 6px 0 0 var(--ink)}
.gbtn.red{background:var(--red);box-shadow:var(--bd),inset 0 -4px 0 0 var(--redd),inset 3px 3px 0 0 #ffb3c8,3px 6px 0 0 var(--ink)}
.gbtn.gray{background:#d9d0f0;color:var(--ink);text-shadow:none;box-shadow:var(--bd),inset 0 -4px 0 0 #9a8fbe,inset 3px 3px 0 0 #fff,3px 6px 0 0 var(--ink)}
.gbtn.mega{font-size:28px;padding:14px 38px;animation:pulse 1.2s steps(2) infinite}.gbtn.mega span{font-size:12px}
.gbtn.mega2{width:calc(100% - 6px);font-size:17px;padding:13px;cursor:pointer}
.gbtn.but img{vertical-align:middle}
@keyframes pulse{50%{transform:translateY(-3px)}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;margin:3px;background:var(--paper);box-shadow:var(--bd),inset 0 -3px 0 0 #e6d6b8;font-size:14px}
.pill.sm{font-size:12px;padding:4px 8px}
/* main */
#main{background-color:#ffd6f3;background-image:conic-gradient(#ffcaf0 25%,transparent 0 50%,#ffcaf0 0 75%,transparent 0);background-size:8px 8px}
.mh{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;background:var(--pink);box-shadow:0 4px 0 0 var(--ink),0 8px 0 0 var(--lav);position:relative;z-index:2}
.avatar{width:50px;height:50px;background:var(--paper);box-shadow:var(--bd);overflow:hidden;padding:2px;margin:3px;display:flex;align-items:flex-end;justify-content:center}

.xpbar{height:10px;background:var(--ink);margin-top:3px;padding:2px}.xpbar i{display:block;height:100%;background:var(--yel);transition:width .5s steps(8)}

.content{flex:1;overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}

.nav button b{font-size:20px;font-weight:400}.nav button.on{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--ink);box-shadow:inset 0 3px 0 0 var(--pinkl)}.nav button.on b{animation:bob .8s steps(2) infinite}
.ph{margin:4px 2px 10px;font-size:20px;font-weight:400;text-shadow:2px 2px 0 #fff}

.center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}

  return `<div class="rcp"><div class="rcl">${cupSvg(layersOf(r.p), 76)}</div><div class="rcr"><h4>${esc(r.name)}</h4>
   <div class="ings">${r.ing.map(i => `<span class="ing">${CAT[i] || '⭐'} ${esc(i)}</span>`).join('')}</div>
   <table class="qt"><tr><th>항목</th><th>정답</th>${mine ? '<th>내 답</th>' : ''}</tr>${rows}</table></div></div>

}

/* ----- challenge builders ----- */
function recipePool(st) {
  if (st.kind === 'custom') return customRecipes();
  if (st.kind === 'recipe') return RECIPES.filter(r => r.stage === st.st);
  return [...RECIPES, ...customRecipes()];
}
function clausePool(st) { return st.kind === 'contract' ? ALLCL.filter(c => c.o === SETS[st.set].id) : ALLCL; }
